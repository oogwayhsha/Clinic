<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Clinic - Register</title>
  <link rel="stylesheet" href="register.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <!-- HEADER BRANDING -->
    <header class="clinic-header">
      <div class="brand-info">
        <img src="Nu-logo.png" alt="NU Logo" class="nu-logo">
        <div class="brand-text">
          <h1>NATIONAL UNIVERSITY - FAIRVIEW CLINIC</h1>
          <p>APPOINTMENT SYSTEM</p>
        </div>
      </div>
    </header>

    <!-- WELCOME SECTION -->
    <section class="welcome-card">
      <h2>Create your account, <br><span class="highlight">stay healthy.</span></h2>
      <p>Register now to book clinic appointments and manage your health records effortlessly.</p>
    </section>

    <!-- ROLE SWITCHER TABS -->
    <div class="role-switcher">
      <button type="button" class="tab-btn active" id="studentTab" onclick="switchRole('student')">
        <i class="fa-solid fa-user-graduate"></i> Student
      </button>
      <button type="button" class="tab-btn" id="employeeTab" onclick="switchRole('employee')">
        <i class="fa-solid fa-id-badge"></i> Employee / Staff
      </button>
    </div>

    <!-- REGISTER FORM CARD -->
    <main class="form-card">
      <h3 class="form-title" id="formRoleTitle">Student Registration</h3>

      <form id="registerForm">
        <!-- Common Field: Full Name -->
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Full Name</label>
          <input type="text" id="regName" placeholder="Enter full name">
          <span id="regNameError" class="error"></span>
        </div>

        <!-- DYNAMIC FIELDS FOR STUDENT -->
        <div id="studentFields">
          <div class="form-group">
            <label><i class="fa-solid fa-id-card"></i> Student ID Number</label>
            <input type="text" id="studentId" placeholder="e.g. 2022-123456">
            <span id="studentIdError" class="error"></span>
          </div>
          <div class="form-group">
            <label><i class="fa-solid fa-graduation-cap"></i> Program / Course & Year</label>
            <input type="text" id="studentCourse" placeholder="e.g. BS CpE - 3rd Year">
            <span id="studentCourseError" class="error"></span>
          </div>
        </div>

        <!-- DYNAMIC FIELDS FOR EMPLOYEE (Hidden by default) -->
        <div id="employeeFields" style="display: none;">
          <div class="form-group">
            <label><i class="fa-solid fa-briefcase"></i> Employee ID Number</label>
            <input type="text" id="employeeId" placeholder="e.g. EMP-2023-089">
            <span id="employeeIdError" class="error"></span>
          </div>
          <div class="form-group">
            <label><i class="fa-solid fa-building"></i> Department / Office</label>
            <input type="text" id="employeeDept" placeholder="e.g. School of Engineering">
            <span id="employeeDeptError" class="error"></span>
          </div>
        </div>

        <!-- Common Fields: Email -->
        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> NU Email Address</label>
          <input type="email" id="regEmail" placeholder="username@students.nu-fairview.edu.ph">
          <span id="regEmailError" class="error"></span>
        </div>

        <!-- Common Fields: Password -->
        <div class="form-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <div class="password-input">
            <input type="password" id="regPassword" placeholder="Create password">
            <i class="fa-solid fa-eye" id="togglePassword"></i>
          </div>
          <span id="regPasswordError" class="error"></span>
        </div>

        <!-- Common Fields: Confirm Password -->
        <div class="form-group">
          <label><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
          <div class="password-input">
            <input type="password" id="regConfirmPassword" placeholder="Confirm password">
            <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>
          </div>
          <span id="regConfirmPasswordError" class="error"></span>
        </div>

        <!-- Register Action Button -->
        <button type="submit" class="btn-primary">
          <span>Complete Registration</span>
          <div class="arrow-icon"><i class="fa-solid fa-arrow-right"></i></div>
        </button>

        <!-- Redirect Link -->
        <div class="login-redirect">
          <span>Already have an account?</span>
          <a href="../login/login.html">Sign In</a>
        </div>

        <p id="regMessage"></p>
      </form>
    </main>

    <!-- FOOTER TAGLINE -->
    <footer class="clinic-footer">
      <i class="fa-solid fa-heart-pulse footer-icon"></i>
      <div>
        <strong>Your health. Our priority.</strong>
        <p>We're here for you. ❤️</p>
      </div>
    </footer>
  </div>

  <script type="module" src="register.js"></script>
</body>
</html>
